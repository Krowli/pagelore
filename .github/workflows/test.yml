name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          # 3.9 is the floor because it is what a stock macOS ships, so the
          # floor has to be tested rather than declared. actions/python-versions
          # publishes 3.9 for darwin-x64 but not darwin-arm64 or win32, so the
          # macOS row is the Intel image and there is no Windows row: on Windows
          # a user installs Python anyway and gets a current one. `macos-13` is
          # the wrong label for that Intel image — it is being retired and a job
          # asking for it sits in the queue forever without ever starting, which
          # leaves the whole run incomplete rather than red.
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-15-intel
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests (FTS5 index path)
        run: pytest
      # Every machine in this matrix has FTS5, so without this the fallback ranker
      # — the one that answers on a read-only store, during a rebuild, or on a
      # Python without sqlite3 — is never executed and rots undetected.
      - name: Run tests (fallback, index disabled)
        env:
          PAGELORE_NO_FTS5: "1"
        run: pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      # Until 0.4.0 `pyproject.toml` carried `py-modules = []` and the built
      # distribution contained no program at all — LICENSE, README, pyproject and
      # ten test files. Nobody noticed for months because nothing inspected the
      # artefact. This step is that inspection.
      - name: The wheel contains the program, the data, and nothing else
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          tops = {n.split("/")[0] for n in names}
          expected = {"pagelore"} | {t for t in tops if t.endswith(".dist-info")}

          missing = {"pagelore/cli.py", "pagelore/search.py", "pagelore/write.py",
                     "pagelore/index.py", "pagelore/stats.py", "pagelore/lib.py",
                     "pagelore/init.py", "pagelore/instructions.py", "pagelore/mcp.py",
                     "pagelore/data/AGENT.md", "pagelore/data/page-template.md"} - set(names)
          assert not missing, f"the wheel is missing {sorted(missing)}"
          assert tops == expected, f"unexpected top-level entries: {sorted(tops - expected)}"
          assert not [n for n in names if n.endswith((".pyc", ".pyo"))], "compiled bytecode shipped"
          assert not [n for n in names if "__pycache__" in n], "__pycache__ shipped"
          print(f"{len(names)} entries, all under {sorted(expected)}")
          PY

      - name: The sdist can build the wheel on its own
        run: |
          set -euo pipefail
          mkdir -p /tmp/fromsdist && tar -xzf dist/*.tar.gz -C /tmp/fromsdist --strip-components=1
          cd /tmp/fromsdist && python -m build --wheel
          python -c "import glob; print(glob.glob('dist/*.whl'))"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install-smoke:
    name: install and use it (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # pytest runs with `pythonpath = ["src"]` and therefore never touches the
      # built artefact. This job is the only thing that does what a user does.
      - name: Install the wheel as a user would
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pipx
          python -m pipx install --force dist/*.whl
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write a page and find it again
        run: |
          set -euo pipefail
          lore --version
          work=$(mktemp -d) && cd "$work"
          git init -q && mkdir -p src .memory && echo 'export {}' > src/a.ts
          lore write --slug probe --title "Probe" --kind bug --source src/a.ts --body - <<'PMEOF'
          ## Cause

          Enough body to clear the floor the write gate applies, so the page is
          actually written and the command after this one has something to find.
          A shorter body is refused, which is the behaviour being relied on here.
          PMEOF
          lore search "probe floor"
          lore search "probe floor" | grep -q probe
          lore search --touching src/a.ts | grep -q "touches src/a.ts"
          lore stats
          lore doctor || true          # exits non-zero when nothing is connected, which is the case here

      # The other route in, end to end, with the binary a harness would run: the
      # server answers the handshake, init registers it, doctor sees it and proves
      # it answers, uninstall takes it back out. The runner's HOME is throwaway, so
      # `lore uninstall` touching the global files is what is being tested, not a
      # hazard; and no `claude` or `codex` is on PATH, so nothing is run for them.
      - name: The MCP server answers tools/list, and init, doctor and uninstall know about it
        run: |
          set -euo pipefail
          work=$(mktemp -d) && cd "$work" && git init -q && mkdir -p .memory
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
                        '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | lore mcp > out.jsonl
          python -c "import json,sys; ls=[json.loads(l) for l in open('out.jsonl') if l.strip()]; \
            assert len(ls)==2, ls; assert {t['name'] for t in ls[1]['result']['tools']}=={'memory_search','memory_write'}, ls"
          lore init --scope project --agent claude --via mcp --yes
          grep -q '"pagelore"' .mcp.json
          lore doctor --json > doctor.json
          python -c "import json; f={r['check']:r for r in json.load(open('doctor.json'))['findings']}; \
            assert f['mcp:claude']['ok'] is True, f['mcp:claude']; assert f['mcp:handshake']['ok'] is True, f['mcp:handshake']"
          lore doctor
          lore uninstall
          test ! -f .mcp.json

      - name: A refused write says how to fix it, and exits non-zero
        run: |
          set -euo pipefail
          work=$(mktemp -d) && cd "$work" && mkdir -p .memory
          if lore write --slug thin --title "Thin" --kind bug --body "too short" 2>err.txt; then
            echo "::error::a page with no source and no body was accepted"; exit 1
          fi
          grep -q "FIX:" err.txt || { echo "::error::a refusal printed no FIX: line"; cat err.txt; exit 1; }

      - name: Bare invocation exits 0, an unknown command exits 2
        run: |
          set -euo pipefail
          lore > /dev/null   # an agent probing whether the tool exists must not read failure
          if lore nonsense 2>/dev/null; then
            echo "::error::an unknown command exited 0"; exit 1
          fi

  npm-pack:
    name: the npm tarball carries the same program (${{ matrix.os }})
    # Every OS, not only Linux: finding an interpreter is platform-specific (Windows
    # has `py -3` and no `python3`), and that search is the shim's whole job.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: node --check npm/bin/lore.js && node --check npm/scripts/vendor.js
      - name: Pack
        working-directory: npm
        run: npm pack

      # `vendor/` is generated and gitignored: one copy of this program is under
      # version control and it is the one in `src/`. A stale vendored copy would be
      # a version of the program whose source nobody can find, so the tarball's
      # bytes are compared against the tree's.
      - name: The vendored Python is byte-identical to src/
        run: |
          python - <<'PY'
          import glob, hashlib, tarfile
          from pathlib import Path

          def digest(data): return hashlib.sha256(data).hexdigest()

          # as_posix: tar member names always use "/", Windows paths do not.
          tree = {p.relative_to("src").as_posix(): digest(p.read_bytes())
                  for p in sorted(Path("src/pagelore").rglob("*"))
                  if p.is_file() and "__pycache__" not in p.parts}

          packed = {}
          with tarfile.open(glob.glob("npm/*.tgz")[0]) as tar:
              for member in tar.getmembers():
                  if not member.isfile() or "/vendor/" not in member.name:
                      continue
                  key = member.name.split("/vendor/", 1)[1]
                  packed[key] = digest(tar.extractfile(member).read())

          assert packed, "the tarball has no vendor/ at all"
          only_tree = sorted(set(tree) - set(packed))
          only_packed = sorted(set(packed) - set(tree))
          differing = sorted(k for k in set(tree) & set(packed) if tree[k] != packed[k])
          assert not only_tree, f"missing from the tarball: {only_tree}"
          assert not only_packed, f"in the tarball but not in src/: {only_packed}"
          assert not differing, f"different bytes: {differing}"
          print(f"{len(packed)} files, identical")
          PY

      - name: Install it globally and use it
        run: |
          set -euo pipefail
          npm install -g ./npm/pagelore-*.tgz
          lore --version
          work=$(mktemp -d) && cd "$work" && mkdir -p src .memory && echo 'export {}' > src/a.ts
          lore write --slug probe --title "Probe" --kind bug --source src/a.ts --body - <<'PMEOF'
          ## Cause

          Enough body to clear the two-hundred-character floor the write gate
          applies, so the page is written through the shim rather than refused, and
          the search that follows has something real to find and rank.
          PMEOF
          lore search "probe floor" | grep -q probe

      # The shim's whole reason to exist is finding an interpreter. An interpreter
      # below the floor must be skipped silently and a named one that does not work
      # must fail loudly — neither is visible from the Python side.
      - name: A named interpreter that does not exist fails loudly
        run: |
          set -euo pipefail
          if PAGELORE_PYTHON=/nonexistent/python lore --version 2>err.txt; then
            echo "::error::a broken PAGELORE_PYTHON was silently ignored"; exit 1
          fi
          grep -q "so nothing else was tried" err.txt || { cat err.txt; exit 1; }

      # A shell script cannot be spawned as an executable on Windows, so this stand-in
      # for an old interpreter only exists on the POSIX runners.
      - name: An interpreter below the floor is skipped, not reported as broken
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexit 69\n' > /tmp/too-old && chmod +x /tmp/too-old
          if PAGELORE_PYTHON=/tmp/too-old lore --version 2>err.txt; then
            echo "::error::exit 69 was treated as success"; exit 1
          fi
          grep -q "older than Python" err.txt || { cat err.txt; exit 1; }

      # `npm install -g` succeeds on a machine with no Python at all — there is
      # deliberately no postinstall — so the first `lore` is where the user learns
      # it is missing. That run must name what is missing and how to fix it. PATH
      # points at an empty directory so no interpreter can be found; node and the
      # shim are called by absolute path.
      - name: With no Python on PATH, lore says what is missing and how to fix it
        run: |
          set -euo pipefail
          node_bin=$(command -v node)
          shim="$(npm root -g)/pagelore/bin/lore.js"
          empty=$(mktemp -d)
          if env -u PAGELORE_PYTHON -u PROJECT_MEMORY_PYTHON PATH="$empty" \
               "$node_bin" "$shim" --version 2>err.txt; then
            echo "::error::lore ran with no Python on PATH"; cat err.txt; exit 1
          fi
          cat err.txt
          grep -q "could not find it" err.txt || exit 1
          grep -q "FIX: install Python" err.txt || exit 1
