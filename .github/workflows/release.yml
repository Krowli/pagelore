name: release

on:
  push:
    tags: ["v*"]
  # A failed publish burns a version number: PyPI will not accept the same one
  # twice, even after a delete. So the whole path is rehearsable against TestPyPI
  # before a tag exists.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Publish to TestPyPI and pack npm without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: the tag, the code and the changelog agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - id: check
        run: |
          set -euo pipefail
          code=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/pagelore/__init__.py').read_text()).group(1))")
          npm=$(python -c "import json;print(json.load(open('npm/package.json'))['version'])")
          echo "code=$code npm=$npm"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag"
            test "$tag" = "$code" || { echo "::error::tag $tag != src/pagelore/__init__.py $code"; exit 1; }
          fi
          test "$code" = "$npm" || { echo "::error::npm/package.json $npm != $code"; exit 1; }
          grep -q "\[$code\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$code] section"; exit 1; }
          echo "version=$code" >> "$GITHUB_OUTPUT"

      - name: Extract the changelog section for this version
        run: |
          awk -v v="${{ steps.check.outputs.version }}" '
            $0 ~ "^## \\["v"\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_BODY.md
          test -s RELEASE_BODY.md || { echo "::error::the changelog section is empty"; exit 1; }
          cat RELEASE_BODY.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-body
          path: RELEASE_BODY.md

  build:
    name: build both artefacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      # Until 0.4.0 the built distribution contained no program at all. Never
      # publish one again without looking inside it first.
      - name: The wheel contains the program
        run: |
          python - <<'PY'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          required = {"pagelore/cli.py", "pagelore/search.py", "pagelore/write.py",
                      "pagelore/data/AGENT.md"}
          assert required <= names, f"the wheel is missing {sorted(required - names)}"
          print(f"{len(names)} entries")
          PY

      - name: Pack the npm tarball
        working-directory: npm
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            npm/*.tgz

  pypi:
    name: publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    # PyPI first, because a PyPI version can never be replaced and an npm one can.
    # Put the unrecoverable step where a failure costs the least.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write          # trusted publishing: no API token anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      # Two steps rather than one with a computed `repository-url`: an empty
      # string there is not the same as omitting it, and getting that wrong on the
      # real registry is the one mistake this file cannot take back.
      - name: TestPyPI (rehearsal)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
      - name: PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A PyPI version is immutable, so a later step failing must not make this
          # one un-rerunnable. Without it, a tag that got past PyPI and fell over at
          # npm could never be retried: the retry would die here on a duplicate and
          # the steps that actually failed would never run again.
          skip-existing: true

  npm:
    name: publish to npm
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # provenance, so the tarball is traceable to this run
    steps:
      - uses: actions/checkout@v7
      # Node 24 because trusted publishing needs npm 11.5.1 and Node 22.14; the 22
      # line in the tool cache ships npm 10 and would fall back to asking for a token.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Published from the package directory with no argument, which packs through
      # `prepack` on the way. The first attempt passed the pre-built tarball as
      # `npm/pagelore-0.4.0.tgz`, and npm read that as the git shorthand
      # `<owner>/<repo>` — it went looking for a GitHub repository called
      # `npm/pagelore-0.4.0.tgz` and failed on an SSH key. A leading `./` would also
      # fix it, but publishing the directory is npm's ordinary path and has no spec
      # to misread at all.
      #
      # No token. npm's trusted publishing signs a short-lived OIDC credential from
      # this workflow, the same arrangement PyPI uses above. 0.4.0 was published by
      # hand because a trusted publisher can only be configured on a package that
      # already exists, and getting there through a token cost four failed runs:
      # classic automation tokens were removed in November 2025, and a granular token
      # needs a separate `Bypass 2FA` option that takes precedence over every
      # account-level setting. npm is also removing direct publishing by such tokens
      # in January 2027, so OIDC is the only arrangement with a future.
      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
        working-directory: npm
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "pagelore@$version" version >/dev/null 2>&1; then
            echo "pagelore@$version is already on the registry; nothing to do"
            exit 0
          fi
          npm publish --provenance --access public
          # npm answers before the version is readable: "your package is being
          # processed and may take a few minutes to become available". A `curl` run
          # straight after a green job returns 404 and looks like a silent failure,
          # so the job waits for the thing it just claimed to have done.
          for _ in $(seq 1 30); do
            npm view "pagelore@$version" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::warning::published but not yet visible on the registry after five minutes"

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        working-directory: npm
        run: npm publish --dry-run --access public

  github-release:
    name: publish the GitHub release
    needs: [verify, pypi, npm]
    # Runs when PyPI succeeded, even if npm did not. One registry refusing a token
    # must not withhold the release notes and the artefacts from everyone else: the
    # first 0.4.0 attempt published to PyPI, failed at npm, and left no GitHub
    # release at all, so the version existed and nothing said what was in it. The run
    # is still red, so nobody reads this as npm having worked.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-body
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      # Create or update, because this job is re-run: 0.4.0 needed three attempts
      # before npm was sorted out, and `gh release create` fails outright on a tag
      # that already has a release. A step in a release workflow that cannot be
      # repeated turns one bad attempt into a dead version number.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_BODY.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/* npm/pagelore-*.tgz
            echo "updated the existing release"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_BODY.md \
              dist/* npm/pagelore-*.tgz
          fi
