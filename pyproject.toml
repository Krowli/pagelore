[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pagelore"
dynamic = ["version"]
description = "Durable project memory as markdown pages on disk, searchable without a server"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Yehven Shcherbynskyi", email = "lionmause999@gmail.com" }]
keywords = [
  "memory", "retrieval", "bm25", "knowledge-base", "context",
  "agents", "llm", "claude-code", "codex", "mcp", "cursor", "gemini",
  "markdown", "ai-agents", "agent-memory", "sqlite", "fts5",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []          # runtime is stdlib-only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Krowli/pagelore"
Documentation = "https://github.com/Krowli/pagelore/tree/main/docs"
Repository = "https://github.com/Krowli/pagelore"
Changelog = "https://github.com/Krowli/pagelore/blob/main/CHANGELOG.md"
Issues = "https://github.com/Krowli/pagelore/issues"

# Two names for one program. `lore` is the documented one; `pagelore` is the escape
# hatch for a machine where something else already owns three letters in the most
# contested namespace a developer has. Every message reflects whichever ran.
[project.scripts]
lore = "pagelore.cli:main"
pagelore = "pagelore.cli:main"

# The version is read out of the source, not written here. A literal in this file
# would be a second truth, and this project already learned what ten of those cost.
[tool.hatch.version]
path = "src/pagelore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pagelore"]

# The sdist is something a person can `pip install` and then `pytest`. It carries
# the program, the suite, and the two root files the suite reads. Not evals/ (a
# third of a megabyte of fixtures useless without fastembed), not docs/, not the
# store.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/AGENTS.md"]

# `src/` layout, and it is load-bearing rather than stylistic. The previous flat
# layout made setuptools see evals/, skills/ and tests/ as competing top-level
# packages; that was silenced with `py-modules = []`, which declared the project
# had no code — and so the built distribution never contained the program, for the
# whole life of the project. A layout cannot regress the way an exclude list can.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set changes between releases.
select = ["E4", "E7", "E9", "E402", "F", "I", "RUF"]
# RUF001/2/3: the corpus and its fixtures are deliberately bilingual
# (Cyrillic + Latin). Flagging Cyrillic as "ambiguous" is noise here.
ignore = ["RUF001", "RUF002", "RUF003"]
